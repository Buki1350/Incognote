<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incognote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">IN</div>
        <div>
          <h1>Incognote</h1>
          <p class="subtitle">Secure shared notes with RBAC and optional AES encryption</p>
        </div>
      </div>
      <div class="btn-row">
        <span id="user-pill" class="mono hidden"></span>
        <button id="logout-btn" class="btn-secondary hidden">Logout</button>
      </div>
    </header>

    <section id="status-bar" class="status hidden"></section>

    <section id="auth-section" class="grid">
      <article class="card">
        <h2 id="auth-title">Login</h2>
        <form id="auth-form" class="stack">
          <label>
            Email
            <input id="auth-email" type="email" maxlength="254" autocomplete="email" required />
          </label>
          <label id="register-username-wrap" class="hidden">
            Username
            <input id="auth-username" type="text" maxlength="32" autocomplete="username" />
          </label>
          <label>
            Password
            <input id="auth-password" type="password" maxlength="128" autocomplete="current-password" required />
          </label>
          <label id="register-confirm-password-wrap" class="hidden">
            Confirm Password
            <input id="auth-confirm-password" type="password" maxlength="128" autocomplete="new-password" />
          </label>
          <div class="btn-row">
            <button class="btn-primary" type="submit" id="auth-submit">Login</button>
            <button class="btn-secondary" type="button" id="auth-toggle">Need an account?</button>
          </div>
        </form>
      </article>

      <!--<article class="card">
        <h2>Security Guide</h2>
        <div class="stack mono">
          <p>1. Use a password with letters + digits.</p>
          <p>2. Verify your email before first login.</p>
          <p>3. Optional private key protects note/message content.</p>
          <p>4. If Auth Service is unavailable, note operations are denied by design.</p>
        </div>
      </article>-->
    </section>

    <section id="app-section" class="grid hidden">
      <div class="sidebar-nav">
        <button class="btn-secondary" id="nav-notes-btn">Notes</button>
        <button class="btn-secondary" id="nav-friends-btn">Friends</button>
        <button class="btn-secondary" id="nav-messages-btn">Messages</button>
        <button class="btn-secondary" id="nav-keys-btn">Keys</button>
        <button class="btn-secondary" id="nav-admin-btn" style="display:none">Admin</button>
      </div>

      <div id="panel-container">
        <div id="notes-view" class="active">
          <article class="card">
            <h2>Create Note</h2>
            <form id="create-form" class="stack">
              <label>
                Content
                <textarea id="create-content" maxlength="5000" required></textarea>
              </label>
              <p class="mono">Optional private key is used for note encryption.</p>
              <input id="note-key-file" type="file" accept=".txt" hidden />
              <p id="note-key-label" class="mono hidden">No key selected.</p>
              <div class="btn-row">
                <button class="btn-primary" type="submit">Create</button>
                <button class="btn-secondary" type="button" id="note-encrypt-btn">Encrypt</button>
                <button class="btn-secondary" type="button" id="refresh-btn">Refresh</button>
              </div>
            </form>
          </article>

          <article class="card">
            <h2>Notes</h2>
            <div id="note-list" class="note-list"></div>
          </article>

          <article class="card">
            <h2>View / Edit</h2>
            <div id="viewer-empty" class="mono">Choose a note to inspect or edit.</div>
            <form id="viewer-form" class="viewer hidden">
              <p class="mono" id="viewer-meta"></p>
              <label>
                Content
                <textarea id="viewer-content" maxlength="5000" required></textarea>
              </label>
              <div class="btn-row">
                <button class="btn-primary" type="submit" id="save-btn">Save</button>
                <button class="btn-danger" type="button" id="delete-btn">Delete</button>
              </div>
              <hr style="border: none; border-top: 1px solid var(--line); margin: 4px 0;" />
              <label>
                Share with friend
                <select id="share-friend">
                  <option value="">Select a friend...</option>
                </select>
              </label>
              <label>
                Permission
                <select id="share-permission">
                  <option value="read">read</option>
                  <option value="write">write</option>
                </select>
              </label>
              <button class="btn-secondary" type="button" id="share-btn">Share</button>
            </form>
          </article>
        </div>

        <div id="friends-view" class="hidden">
          <article class="card">
            <h2>Friends</h2>
            <div class="stack">
              <label>
                Add friend (username or email)
                <input id="friend-identifier" type="text" maxlength="254" />
              </label>
              <div class="btn-row">
                <button class="btn-secondary" type="button" id="add-friend-btn">Send invite</button>
                <button class="btn-secondary" type="button" id="refresh-friends-btn">Refresh friends</button>
              </div>
              <div id="friend-list" class="note-list"></div>
              <div class="btn-row">
                <button class="btn-secondary" type="button" id="refresh-invites-btn">Refresh invites</button>
              </div>
              <div id="invite-list" class="note-list"></div>
            </div>
          </article>
        </div>

        <div id="messages-view" class="hidden">
          <article class="card">
            <h2>Messages</h2>
            <div class="stack">
              <label>
                Private key (optional, for notes + messages)
                <input id="global-private-key" type="password" maxlength="256" />
              </label>
              <label>
                Load private key from .txt
                <input id="private-key-file" type="file" accept=".txt" />
              </label>
              <p id="private-key-path" class="mono">No key file selected.</p>
              <hr style="border: none; border-top: 1px solid var(--line); margin: 4px 0;" />
              <label>
                Send message to friend
                <select id="message-recipient"></select>
              </label>
              <label>
                Message content
                <textarea id="message-content" maxlength="5000"></textarea>
              </label>
              <div class="btn-row">
                <button class="btn-primary" type="button" id="send-message-btn">Send message</button>
                <button class="btn-secondary" type="button" id="refresh-messages-btn">Refresh messages</button>
              </div>
              <div id="message-list" class="note-list"></div>
            </div>
          </article>
        </div>

        <div id="keys-view" class="hidden">
          <article class="card">
            <h2>Generate Key</h2>
            <div class="stack">
              <label>
                Key value
                <input id="key-value" type="text" maxlength="256" />
              </label>
              <div class="btn-row">
                <button class="btn-primary" type="button" id="save-key-btn">Download as file</button>
              </div>
            </div>
          </article>
        </div>

        <div id="admin-view" class="hidden">
          <article class="card">
            <h2>All Users</h2>
            <div id="admin-user-list" class="note-list"></div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
