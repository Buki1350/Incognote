services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-incognote}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-incognote}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-incognote}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-incognote}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_TTL_SECONDS: "${JWT_TTL_SECONDS:-3600}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@incognote.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      TRUSTED_EMAIL_DOMAINS: "${TRUSTED_EMAIL_DOMAINS:-gmail.com,googlemail.com,outlook.com,hotmail.com,live.com,yahoo.com,icloud.com,proton.me,protonmail.com,incognote.local}"
      NOTE_ENCRYPTION_KEY: "${NOTE_ENCRYPTION_KEY:?Set NOTE_ENCRYPTION_KEY in .env}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-Incognote <no-reply@incognote.local>}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost}"
      GEOIP_API_BASE_URL: "${GEOIP_API_BASE_URL:-https://ipapi.co}"
      RUST_LOG: "${RUST_LOG:-auth-service=info,notes-service=info,tower_http=info}"

volumes:
  postgres_data:
